[package]
name = "amp-audio"
version = "0.1.0"
edition = "2024"

[dependencies]
snapcast-client = "0.18"
snapcast-proto = "0.18"
cpal = "0.15"
tokio = { version = "1", features = ["sync", "rt", "time", "macros"] }

[dev-dependencies]
snapcast-server = "0.18"
tokio = { version = "1", features = ["net", "rt-multi-thread"] }
