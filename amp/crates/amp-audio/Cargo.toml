[package]
name = "amp-audio"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.15"
snapcast-client = "0.18"
snapcast-proto = "0.18"
tokio = { version = "1", features = ["rt", "sync"] }

[dev-dependencies]
snapcast-server = "0.18"
tokio = { version = "1", features = ["macros", "net", "rt", "time"] }
