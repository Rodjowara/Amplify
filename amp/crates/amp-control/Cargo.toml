[package]
name = "amp-control"
version = "0.1.0"
edition = "2024"

[dependencies]
amp-audio = { path = "../amp-audio" }
prost = "0.14"
tokio = { version = "1", features = ["net", "rt-multi-thread"] }
tonic = "0.14"
tonic-prost = "0.14"

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tokio = { version = "1", features = ["macros"] }
